# Crucibles from Grimwild: Community Edition (text CC0; based on
# Grimwild by J. D. Maxwell, Oddity Press, CC BY 4.0). Each table is 6x6: roll
# 2d6, one die picks the row and the other the column, or switch them (pg. 6).
#
# Extracted from the book's text layer. Multi-word cells (e.g. "fortune
# teller") were split by hand; check new tables against the PDF.
- key: gm
  name: GM crucible
  group: gm
  page: 94
  blurb: The seed of an idea when the story needs one.
  how: 'Roll once on each table. Each roll reads two ways (3 and 1 is 31 or 13): pick the most evocative pair, smash it together, and interpret.'
  tables:
  - name: Quality
    rows:
    - [tough, quiet, precarious, wild, mysterious, rustic]
    - [muffled, aged, romantic, menacing, puzzling, eerie]
    - [broken, dwindling, distant, perilous, bleak, tense]
    - [forgotten, abundant, hidden, withered, chaotic, looming]
    - [festive, lost, immense, serene, vibrant, flickering]
    - [rugged, splintered, sacred, relentless, tangled, twisted]
  - name: Thing
    rows:
    - [journey, juncture, rift, scheme, nexus, team]
    - [tremor, debris, symbol, scar, archive, chasm]
    - [sanctuary, betrayal, trail, wasteland, help, mystery]
    - [peak, threshold, boundary, beacon, secret, wall]
    - [territory, rumor, standoff, strife, maze, pact]
    - [dilemma, tradition, jackpot, omen, deception, illusion]
