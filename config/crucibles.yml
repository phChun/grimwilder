- key: monster_riddle
  name: Riddle
  group: monsters
  page: 169
  blurb: From the sphinx on pg. 169.
  how: Roll on each list, choose 1 or 2, and pose it as a riddle. If an answer is relatively close, accept it.
  tables:
  - name: First
    columns: [First]
    rows: [[It flows but has no shape.], ["It grows taller, then vanishes."], [It travels far but takes no steps.], [It burns but leaves no ashes.], [It counts the moments but has no hands.], [It falls but makes no sound.]]
  - name: Second
    columns: [Second]
    rows: [[It's cold but not frozen.], [It's bright but not hot.], [It hums when the world is still.], [It's full but never complete.], [It's fleeting but always returns.], [It's hidden in plain sight.]]
  - name: Third
    columns: [Third]
    rows: [[It grows when light dims.], [It follows you on sunny days.], [It stares back from still waters.], [It's buried but not dead.], [It's a silent companion.], [It's a path without end.]]
