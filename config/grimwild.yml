# Schools of magic, for spell theorems (pg. 87)
magic_schools:
  abjuration: Protects, blocks, dispels, or banishes.
  conjuration: Summons creatures, objects, and portals.
  divination: Reveals information, predicts the future, and reads minds.
  enchantment: Charms, influences, and curses sentient creatures.
  evocation: Creates and controls elemental and magical forces.
  illusion: Generates false images and sensory deceptions.
  necromancy: Manipulates life, death, and the undead.
  transmutation: Transforms matter and alters physical properties.

# Arcana functions: the general effect, and a touchstone (pg. 43)
arcana_functions:
  attack: Lash out to deal direct harm or destruction.
  enhance: Temporarily boost senses, ability, or bestow something new.
  hinder: Impede or debilitate others or areas.
  influence: Alter thoughts, emotions, or perceptions.
  protect: Defend yourself and others from outside harm or influence.
  restore: Heal wounds, cleanse maladies, and mend materials.
  reveal: Sense and reveal the hidden, and uncover new information.
  summon: Manifest objects, creatures, or forces themselves.
  transform: Change the nature or form of the subject.
  traverse: Move across space, through barriers, or in a new way.

