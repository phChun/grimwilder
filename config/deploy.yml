# Name of your application. Used to uniquely configure containers.
service: grimwilder

# Name of the container image, on GitHub's registry (ghcr.io/<user>/grimwilder).
# ghcr.io image names must be lowercase.
image: phchun/grimwilder

# Deploy to these servers.
servers:
  web:
    # The droplet's Reserved IP.
    - 129.212.197.211
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# TLS: Cloudflare proxies grimwilder.com (SSL mode "Full (strict)"), so kamal-proxy
# serves a Cloudflare Origin CA certificate instead of Let's Encrypt, whose renewal
# challenges can't reach the origin through Cloudflare. The cert and key come from
# .kamal/secrets (CERTIFICATE_PEM, PRIVATE_KEY_PEM).
#
# forward_headers passes X-Forwarded-For through to Rails, where cloudflare-rails
# trusts it only from Cloudflare's IP ranges, so request.remote_ip (and rate_limit)
# sees the player's address rather than Cloudflare's.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
proxy:
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  forward_headers: true
  hosts:
    - grimwilder.com
    - www.grimwilder.com # redirects to grimwilder.com (config/routes.rb)

# Where you keep your container images.
registry:
  # GitHub Container Registry. .github/workflows/deploy.yml logs in with the
  # job's own GITHUB_TOKEN; deploys from the Mac need a classic personal access
  # token with write:packages exported as KAMAL_REGISTRY_PASSWORD (from 1Password).
  server: ghcr.io
  username: phChun
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Passkeys are bound to this origin (config/initializers/webauthn.rb).
    APP_ORIGIN: https://grimwilder.com

    # New accounts. false closes sign-ups: existing accounts still sign in, and
    # so does anyone holding a campaign's invite link (config/application.rb).
    ALLOW_SIGNUPS: false

    # Who sign-in code emails come from (app/mailers/application_mailer.rb).
    MAILER_FROM: Grimwilder <no-reply@grimwilder.com>

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use grimwilder-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
# The image has no shell or sqlite3 command (Docker Hardened Images), so
# commands go through Ruby; for a shell, use `docker debug` on the server.
aliases:
  console: app exec --interactive --reuse "ruby bin/rails console"
  logs: app logs -f

# Cap container logs so they can't fill the droplet's disk.
logging:
  options:
    max-size: 50m
    max-file: 3

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "grimwilder_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 4.0.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:9.7
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: valkey/valkey:9
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
