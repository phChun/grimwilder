# Deploys main with Kamal once bin/ci signs a commit off (`gh signoff` sets a
# green "signoff" commit status), or by hand from the Actions tab.
#
# Secrets, in the "production" environment (Settings → Environments):
#   RAILS_MASTER_KEY         contents of config/master.key
#   KAMAL_REGISTRY_PASSWORD  classic personal access token with write:packages (ghcr.io)
#   DOCKERHUB_USERNAME       Docker Hub account, for the dhi.io base images
#   DOCKERHUB_TOKEN          Docker Hub access token
#   SSH_PRIVATE_KEY          a deploy-only key; its public half goes in the droplet's authorized_keys
#   SSH_KNOWN_HOSTS          output of `ssh-keyscan <droplet ip>`
name: Deploy

on:
  status:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'signoff' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

    steps:
      - name: Checkout the signed-off commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the droplet and write the master key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: Deploy
        run: bin/kamal deploy
