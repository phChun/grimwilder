# Deploys main with Kamal on every push to it, or by hand from the Actions tab.
# main only changes through pull requests, and the "Main" ruleset requires the
# "signoff" status that bin/ci sets (`gh signoff`) on the branch first.
#
# Secrets, in the "production" environment (Settings → Environments):
#   RAILS_MASTER_KEY         contents of config/master.key
#   DOCKERHUB_USERNAME       Docker Hub account, for the dhi.io base images
#   DOCKERHUB_TOKEN          Docker Hub access token
#   SSH_PRIVATE_KEY          a deploy-only key; its public half goes in the droplet's authorized_keys
#   SSH_KNOWN_HOSTS          output of `ssh-keyscan <droplet ip>`
#   CERTIFICATE_PEM          Cloudflare Origin CA certificate (PEM)
#   PRIVATE_KEY_PEM          its private key (PEM)
#   DROPLET_IP               the droplet's Reserved IP (config/deploy.yml servers)
#   ERROR_EMAIL_TO           where production error emails go
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      # The job's own token pushes the image to ghcr.io (packages: write above),
      # and the droplet pulls with it during the deploy. Deploys from the Mac use
      # a personal access token instead (config/deploy.yml, registry).
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the droplet and write the master key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: Deploy
        env:
          CERTIFICATE_PEM: ${{ secrets.CERTIFICATE_PEM }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          ERROR_EMAIL_TO: ${{ secrets.ERROR_EMAIL_TO }}
        run: bin/kamal deploy
